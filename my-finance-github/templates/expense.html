{% extends 'base.html' %}{% block content %}<section class="narrow"><h1>Готівкова витрата</h1><p>Змінює витрати та заощадження. Банківський залишок не змінюється; залишок готівки невідомий.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="identifier" value="{{ identifier }}">
<label>Власник<select name="owner">{% for key,name in owners.items() %}<option value="{{ key }}" {% if request.form.get('owner',session.user)==key %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></label>
<label>Сума, PLN<input name="amount" inputmode="decimal" required placeholder="25,50" value="{{ request.form.get('amount','') }}"></label>
<label>Категорія<select name="category">{% for category in categories %}<option value="{{ category }}" {% if request.form.get('category')==category %}selected{% endif %}>{{ category.removeprefix('Expenses:').replace('-',' ') }}</option>{% endfor %}</select></label>
<label>Дата<input type="date" name="day" required min="2026-08-01" max="{{ today }}" value="{{ request.form.get('day',today) }}"></label><label>Опис<input name="description" required maxlength="300" value="{{ request.form.get('description','') }}"></label><button>Зберегти витрату</button></form></section>{% endblock %}
